name: Update TechTicker data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *" # 09:15 Asia/Taipei

permissions:
  contents: write

concurrency:
  group: techticker-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/update.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Update data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/update.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data docs/DASHBOARD.md; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/DASHBOARD.md
          git commit -m "data: daily TechTicker update"
          git push
