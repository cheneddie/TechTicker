name: Deploy TechTicker Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/hardware-cycle-monitor
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: techticker-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check assets/app.js

      - name: Validate data files
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          latest = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          assert "scores" in latest and "events" in latest
          assert len(latest["events"]) == 6
          with Path("data/history/daily.csv").open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert rows, "history CSV must contain at least one row"
          print("web data validation: PASS")
          PY

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data/history
          cp index.html _site/index.html
          cp assets/styles.css assets/app.js _site/assets/
          cp data/latest.json _site/data/latest.json
          cp data/history/daily.csv _site/data/history/daily.csv
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
